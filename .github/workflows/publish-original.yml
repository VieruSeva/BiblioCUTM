name: Publish original laboratory history
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-original.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.event.head_commit.message == 'ci: publish original laboratory Git history'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Restore history test and push every branch and tag
        env:
          HISTORY_BUNDLE: 
        run: |
          python3 - <<'PYCODE'
          import os, base64
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'history.bundle').write_bytes(base64.b64decode(os.environ['HISTORY_BUNDLE']))
          PYCODE
          git config user.name "Vieru Sevastean"
          git config user.email "196898561+VieruSeva@users.noreply.github.com"
          git fetch "$RUNNER_TEMP/history.bundle" 'refs/heads/*:refs/remotes/laboratory/*' 'refs/tags/*:refs/tags/*'
          git merge --allow-unrelated-histories --no-ff refs/remotes/laboratory/main -m "merge: publish original laboratory Git history"
          while IFS= read -r ref; do
            branch="${ref#refs/remotes/laboratory/}"
            if [ "$branch" != main ]; then git branch "$branch" "$ref"; fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/laboratory/)
          python3 -m unittest discover -s tests -v
          git push origin --all
          git push origin --tags
          git log --oneline --graph --decorate --all
          git ls-remote --heads --tags origin
          git show v1.0.0 --no-patch
