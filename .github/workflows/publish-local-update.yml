name: Synchronize local laboratory update
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-local-update.yml]
permissions:
  contents: write
jobs:
  publish:
    if: "${{ github.event.head_commit.message == 'ci: synchronize local laboratory update' }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Merge exact local commit test and push
        env:
          LOCAL_BUNDLE: 
        run: |
          python3 - <<'PYCODE'
          import os, base64
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'local.bundle').write_bytes(base64.b64decode(os.environ['LOCAL_BUNDLE']))
          PYCODE
          git config user.name "Vieru Sevastean"
          git config user.email "196898561+VieruSeva@users.noreply.github.com"
          git fetch "$RUNNER_TEMP/local.bundle" 'refs/heads/main:refs/remotes/laboratory-local/main'
          git merge --no-ff refs/remotes/laboratory-local/main -m "merge: synchronize local laboratory update"
          python3 -m unittest discover -s tests -v
          git push origin main
          git log --oneline --graph --decorate --all
          git ls-remote --heads --tags origin
